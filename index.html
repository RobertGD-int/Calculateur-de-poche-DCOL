function drawDirs(){const e=$("dirs");e.innerHTML="";Object.keys(MAP).forEach(d=>{const b=document.createElement("button");b.className="chip dr"+(ds.has(d)?" on":"");b.textContent=d;b.onclick=()=>{ds.has(d)?ds.delete(d):ds.add(d);auto();drawDirs();render1()};e.appendChild(b)})}
function calc(m){const per=C.s.map(()=>[0,0]),q={};let tot=0,n=0;
 C[m].forEach(([s,l,p,c])=>{if(!on[m].has(l))return;const x=PM[p][2]*c;per[s][0]+=x;per[s][1]+=c;tot+=x;n+=c;q[p]=(q[p]||0)+c});
 return{per,tot,n,ps:Object.keys(q).map(p=>[+p,q[p]]).sort((a,b)=>b[1]*PM[b[0]][2]-a[1]*PM[a[0]][2])}}
function render1(){
 $("ta").classList.toggle("on",mode=="a");$("tb").classList.toggle("on",mode=="b");
 $("cl").textContent=mode=="a"?"Calibers ≥ 20 km/h (lignes précises)":"Calibers ≥ 42 km/h (BOX entière)";
 $("nt").textContent=mode=="a"?"Touchez un caliber pour l’ajouter ou le retirer. p = Kleen Skyburst (toutes directions).":"Touchez un caliber pour l’ajouter ou le retirer. Le caliber désactive toute sa BOX.";
 const e=$("chips");e.innerHTML="";
 LET[mode].forEach(l=>{const b=document.createElement("button");b.className="chip"+(on[mode].has(l)?" on":"");b.textContent=l;b.onclick=()=>{on[mode].has(l)?on[mode].delete(l):on[mode].add(l);render1()};e.appendChild(b)});
 const r=calc(mode);
 $("shows").innerHTML=C.s.map((s,i)=>`<div class="row"><span>${s}</span><span class="num">${r.per[i][1]} lignes</span><b>${fmt(r.per[i][0])} g</b></div>`).join("");
 $("list1").innerHTML=r.ps.length?r.ps.map(([p,c])=>{const e=PM[p];return `<div class="r"><i class="sw" style="background:${bg(e)}"></i><div class="d"><div class="n">${esc(e[1])}</div><div class="m">${e[0]} · ${c} × ${fmt(e[2],2)} g</div></div><b class="rt">${fmt(c*e[2])} g</b></div>`}).join(""):'<p class="note">Aucun caliber sélectionné.</p>';
 setHead()}
/* ---------- onglet Produits ---------- */
const qty=P.map(()=>0),els=[],KEY="dcol-calc-q2",list=$("list2");
try{JSON.parse(localStorage.getItem(KEY)||"[]").forEach((v,i)=>{if(i<qty.length)qty[i]=+v||0})}catch(e){}
G.forEach(c=>{
 const sec=document.createElement("section");sec.innerHTML=`<h2><span>${gt(c)}</span><span class="s"></span></h2><div></div>`;
 P.map((p,i)=>[p,i]).filter(x=>x[0][3]===c).sort((a,b)=>c==="D"?a[1]-b[1]:a[0][1].localeCompare(b[0][1])).forEach(([p,i])=>{
  const r=document.createElement("div");r.className="r";
  r.innerHTML=`<i class="sw" style="background:${bg(p)}"></i><div class="d"><div class="n"></div><div class="m"></div><div class="lt"></div></div><div class="q"><button data-d="-1" aria-label="Moins">−</button><input inputmode="numeric" pattern="[0-9]*" placeholder="0"><button data-d="1" aria-label="Plus">+</button></div>`;
  r.querySelector(".n").textContent=p[1];r.querySelector(".m").textContent=p[0]+" · "+fmt(p[2],2)+" g/u"+(p[6]?" · "+p[6]:"");
  r.dataset.i=i;r._t=norm(p[0]+" "+p[1]);sec.lastChild.appendChild(r);els[i]=r});
 sec._c=c;list.appendChild(sec)});
function upd(){const sub={};
 P.forEach((p,i)=>{const q=qty[i],m=q*p[2],s=sub[p[3]]||(sub[p[3]]=[0,0]);s[0]+=q;s[1]+=m;
  const r=els[i],inp=r.querySelector("input");r.classList.toggle("on",q>0);if(document.activeElement!==inp)inp.value=q||"";
  r.querySelector(".lt").textContent=q?q+" × "+fmt(p[2],2)+" = "+fmt(m)+" g":""});
 [...list.children].forEach(s=>{if(s._c)s.querySelector(".s").textContent=sub[s._c][0]?sub[s._c][0]+" u · "+fmt(sub[s._c][1])+" g":""});
 try{localStorage.setItem(KEY,JSON.stringify(qty))}catch(e){}
 setHead()}
function filt(){
 const t=norm($("q").value).split(/\s+/).filter(Boolean),only=$("only").checked;let any=0;
 [...list.children].forEach(s=>{if(!s._c)return;let v=0;
  s.querySelectorAll(".r").forEach(r=>{const ok=t.every(x=>r._t.includes(x))&&(!only||qty[r.dataset.i]>0);r.hidden=!ok;v+=ok});s.hidden=!v;any+=v});
 let n=list.querySelector(".none");if(!any&&!n){n=document.createElement("p");n.className="none";n.textContent="Aucun produit ne correspond.";list.appendChild(n)}else if(any&&n)n.remove()}
list.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const i=+b.closest(".r").dataset.i;qty[i]=Math.max(0,qty[i]+(+b.dataset.d));upd();if($("only").checked)filt()});
list.addEventListener("input",e=>{const i=+e.target.closest(".r").dataset.i;qty[i]=Math.max(0,parseInt(e.target.value,10)||0);upd()});
list.addEventListener("change",()=>{upd();filt()});
$("q").oninput=filt;$("only").onchange=filt;
/* ---------- en-tête commun ---------- */
function setHead(){let g,tk,lab;
 if(tab==1){const r=calc(mode);g=r.tot;tk=fmt(r.tot/1000,3)+" kg · "+r.n+" ligne"+(r.n>1?"s":"");lab="Calibers actifs · vent ≥ "+(mode=="a"?"20":"42")+" km/h"}
 else{let n=0;g=0;P.forEach((p,i)=>{g+=qty[i]*p[2];n+=qty[i]});tk=fmt(g/1000,3)+" kg · "+n+" unité"+(n>1?"s":"");lab="Produits saisis"}
 $("tg").textContent=fmt(g)+" g";$("tk").textContent=tk;$("tl").textContent="Total M.A. · "+lab}
function show(t){tab=t;$("t1").classList.toggle("on",t==1);$("t2").classList.toggle("on",t==2);$("p1").hidden=t!=1;$("p2").hidden=t!=2;$("sb").hidden=t!=2;setHead();window.scrollTo(0,0)}
$("t1").onclick=()=>show(1);$("t2").onclick=()=>show(2);
$("ta").onclick=()=>{mode="a";render1()};$("tb").onclick=()=>{mode="b";render1()};
$("rzc").onclick=()=>{auto();render1()};
$("rz").onclick=()=>{if(tab==1){ds.clear();auto();drawDirs();render1()}else{if(qty.some(v=>v>0)&&!confirm("Effacer toutes les quantités ?"))return;qty.fill(0);upd();filt()}};
/* ---------- export PDF (onglet actif) ---------- */
function mkPdf(){const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"}),o={doc,y:16,M:14,R:196};
 o.need=h=>{if(o.y+h>284){doc.addPage();o.y=16}};o.T=(t,x,a)=>doc.text(String(t),x,o.y,a||{});o.st=(s,b)=>{doc.setFont("helvetica",b?"bold":"normal");doc.setFontSize(s)};return o}
function stamp(o,title){const d=new Date(),p=v=>String(v).padStart(2,"0");o.st(15,1);o.T(title,o.M);o.y+=6;o.st(9);o.T("Édité le "+p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+" à "+p(d.getHours())+":"+p(d.getMinutes()),o.M);o.y+=7}
function pdf1(){const o=mkPdf(),{doc,M,R}=o,m=mode,r=calc(m),cl=LET[m].filter(l=>on[m].has(l));
 stamp(o,"Cascade of Lights - Sélection de M.A.");
 o.st(11,1);o.T("Vent à partir de "+(m=="a"?"20 km/h":"42 km/h (BOX entières)"),M);o.y+=6;
 o.st(10);if(ds.size){o.T("Directions : "+[...ds].join(", "),M);o.y+=5}
 o.T("Calibers : "+(cl.join(", ")||"aucun"),M);o.y+=8;
 if(!r.n){o.st(10);o.T("Aucune ligne concernée.",M);return doc}
 o.st(12,1);o.T("Total M.A. : "+pf(r.tot)+" g ("+pf(r.tot/1000,3)+" kg) - "+r.n+" lignes",M);o.y+=7;
 o.st(9,1);o.T("Barge",M);o.T("Lignes",150,{align:"right"});o.T("M.A. (g)",R,{align:"right"});o.y+=1.5;doc.line(M,o.y,R,o.y);o.y+=4.5;o.st(9);
 C.s.forEach((s,i)=>{if(!r.per[i][1])return;o.T(s,M);o.T(r.per[i][1],150,{align:"right"});o.T(pf(r.per[i][0]),R,{align:"right"});o.y+=5});
 o.y+=4;o.need(14);o.st(8,1);o.T("Part number",M);o.T("Désignation",M+23);o.T("Qté",150,{align:"right"});o.T("M.A./u (g)",169,{align:"right"});o.T("Total (g)",R,{align:"right"});o.y+=1.5;doc.line(M,o.y,R,o.y);o.y+=4.5;o.st(8.5);
 r.ps.forEach(([p,c])=>{const e=PM[p],ls=doc.splitTextToSize(e[1].replace(/™/g,""),100);o.need(ls.length*4+1);
  ls.forEach((t,k)=>{if(!k){o.T(e[0],M);o.T(c,150,{align:"right"});o.T(pf(e[2],2),169,{align:"right"});o.T(pf(c*e[2]),R,{align:"right"})}o.T(t,M+23);o.y+=4});o.y+=0.8});
 return doc}
function pdf2(){const o=mkPdf(),{doc,M,R}=o;let g=0,n=0;P.forEach((p,i)=>{g+=qty[i]*p[2];n+=qty[i]});
 stamp(o,"Cascade of Lights - Calcul de M.A. (produits)");
 o.st(12,1);o.T("Total M.A. : "+pf(g)+" g ("+pf(g/1000,3)+" kg) - "+n+" unités",M);o.y+=8;
 if(!n){o.st(10);o.T("Aucune quantité saisie.",M);return doc}
 G.forEach(c=>{const L=P.map((p,i)=>[p,qty[i],i]).filter(x=>x[0][3]===c&&x[1]>0).sort((a,b)=>c==="D"?a[2]-b[2]:a[0][1].localeCompare(b[0][1]));if(!L.length)return;
  const u=L.reduce((s,x)=>s+x[1],0),gg=L.reduce((s,x)=>s+x[1]*x[0][2],0);
  o.need(18);o.st(11,1);o.T(gt(c)+" - "+u+" u - "+pf(gg)+" g",M);o.y+=1.5;doc.line(M,o.y,R,o.y);o.y+=4.5;
  o.st(8,1);o.T("Part number",M+5);o.T("Désignation",M+27);o.T("Qté",150,{align:"right"});o.T("M.A./u (g)",169,{align:"right"});o.T("Total (g)",R,{align:"right"});o.y+=4.5;o.st(8.5);
  L.forEach(([p,q])=>{const ls=doc.splitTextToSize(p[1].replace(/™/g,""),88);o.need(ls.length*4+1);
   const rgb=h=>doc.setFillColor(parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16));doc.setDrawColor(120);
   if(p[5]){rgb(p[4]||"FFFFFF");doc.rect(M,o.y-2.6,1.5,3,"FD");rgb(p[5]);doc.rect(M+1.5,o.y-2.6,1.5,3,"FD")}else{p[4]?rgb(p[4]):doc.setFillColor(255,255,255);doc.rect(M,o.y-2.6,3,3,"FD")}
   ls.forEach((t,k)=>{if(!k){o.T(p[0],M+5);o.T(q,150,{align:"right"});o.T(pf(p[2],2),169,{align:"right"});o.T(pf(q*p[2]),R,{align:"right"})}o.T(t,M+27);o.y+=4});o.y+=0.8});
  o.y+=5});
 return doc}
let dl=null;try{window.claude&&claude.use("downloads").then(d=>{dl=d}).catch(()=>{})}catch(e){}
$("pdf").onclick=async()=>{if(!window.jspdf){window.print();return}
 try{const doc=tab==1?pdf1():pdf2(),name=tab==1?"DCOL_selection_calibers.pdf":"DCOL_calcul_produits.pdf";
  if(dl)await dl.save({filename:name,data:doc.output("arraybuffer")});
  else{const a=document.createElement("a");a.href=URL.createObjectURL(doc.output("blob"));a.download=name;document.body.appendChild(a);a.click();a.remove()}}
 catch(e){if(!e||e.code!=="declined")alert("Export PDF impossible.")}};
auto();drawDirs();render1();upd();filt();show(1);
</script></body></html>
